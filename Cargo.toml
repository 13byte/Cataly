[package]
name = "cataly"
version = "0.1.0"
edition = "2024"
description = "Native Cataly controller for stock oh-my-pi sessions"
license-file = "LICENSE"
repository = "https://github.com/vntrevx/Cataly"
publish = false

[[bin]]
name = "cataly"
path = "native/src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
